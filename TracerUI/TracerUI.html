<!--
  VHS Tracer — a pen-first tracing surface, spin-off of the GlyphCollector.

  Load a reference image, drop its opacity, and trace over it with a
  pen-enabled device (Android tablet + stylus, iPad + Apple Pencil, or a
  mouse). Strokes capture pen PRESSURE per point and are visualised with
  variable line width. Two stabilisation mechanics are ported from the
  collector — a pen STABILIZER (EMA over the point positions) and
  Catmull-Rom SMOOTH curves — both non-destructive (raw points are kept).

  Draw across multiple LAYERS, each with its own colour, visibility and
  opacity — e.g. a pencil underdrawing, an ink layer, a faint shadow. Drag a
  layer's grip to restack it. Save files by download, or connect a folder
  (File System Access API) to write straight into it.

  Save as JSON (lossless: artboard + layers + raw {x,y,p,t} points +
  settings, and optionally the reference image embedded as a data-URL, so
  the file is a portable, self-contained project that reopens exactly) or
  export to SVG (processed paths per layer <g>, pressure as variable width).

  Tablet gestures: the PEN draws; one finger PANS; two fingers PINCH-ZOOM.
  Single self-contained file — no build step, no CDN. Open it off disk.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>VHS Tracer</title>
<style>
  :root {
    --bg: #1e232b; --panel: #2a303a; --panel2: #333b47;
    --line: #3d4552; --ink: #e8ecf1; --muted: #9aa5b3;
    --accent: #6366f1; --accent2: #22c55e; --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--ink);
    -webkit-user-select: none; user-select: none; }
  #stage { position: fixed; inset: 0; }
  /* touch-action:none keeps the browser from stealing pen/touch gestures
     (same trick the collector uses) — we implement pan/zoom ourselves. */
  #board { position: absolute; inset: 0; touch-action: none; display: block;
    background:
      repeating-conic-gradient(#262b33 0% 25%, #21262d 0% 50%) 50% / 24px 24px; }

  /* Toolbar */
  #bar { position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    max-width: calc(100vw - 20px);
    background: rgba(42,48,58,0.92); backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.07); border-radius: 12px;
    padding: 8px 10px; box-shadow: 0 6px 24px rgba(0,0,0,0.35); z-index: 5; }
  .grp { display: flex; gap: 6px; align-items: center; }
  .sep { width: 1px; align-self: stretch; background: rgba(255,255,255,0.10); margin: 2px 2px; }
  button, label.file { appearance: none; border: 1px solid rgba(255,255,255,0.10);
    background: var(--panel2); color: var(--ink); border-radius: 9px;
    padding: 9px 12px; font-size: 13px; font-weight: 600; cursor: pointer;
    min-height: 40px; display: inline-flex; align-items: center; gap: 6px; }
  button:hover, label.file:hover { background: #3c4552; }
  button.on { background: var(--accent2); border-color: transparent; color: #06210f; }
  button.ghost { background: transparent; }
  button.danger:hover { background: var(--danger); border-color: transparent; }
  input[type=file] { display: none; }
  .field { display: flex; flex-direction: column; gap: 2px; font-size: 10px;
    color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .field input[type=range] { width: 108px; accent-color: var(--accent); }
  .field .row { display: flex; align-items: center; gap: 6px; }
  input[type=color] { width: 34px; height: 34px; padding: 0; border: none;
    border-radius: 8px; background: none; cursor: pointer; }
  .val { font-variant-numeric: tabular-nums; color: var(--ink); min-width: 30px; text-align: right; }
  .chk { display: flex; align-items: center; gap: 6px; font-size: 12px;
    color: var(--muted); font-weight: 600; }
  .chk input { width: 16px; height: 16px; accent-color: var(--accent2); }

  /* Status readouts */
  #hud { position: absolute; left: 12px; bottom: 12px; z-index: 5;
    display: flex; gap: 14px; font-size: 12px; color: var(--muted);
    background: rgba(42,48,58,0.85); padding: 8px 12px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.06); }
  #hud b { color: var(--ink); font-variant-numeric: tabular-nums; }
  #press { position: absolute; right: 12px; bottom: 12px; z-index: 5;
    width: 150px; background: rgba(42,48,58,0.85); border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.06); padding: 8px 10px; }
  #press .cap { font-size: 10px; color: var(--muted); font-weight: 700;
    text-transform: uppercase; letter-spacing: .05em; display: flex;
    justify-content: space-between; }
  #pbar { height: 8px; margin-top: 6px; border-radius: 5px; overflow: hidden;
    background: rgba(255,255,255,0.08); }
  #pfill { height: 100%; width: 0%; background: linear-gradient(90deg,#22c55e,#6366f1); }
  #drop { position: absolute; inset: 0; z-index: 8; display: none;
    align-items: center; justify-content: center; pointer-events: none;
    background: rgba(99,102,241,0.18); border: 3px dashed var(--accent);
    font-size: 22px; font-weight: 700; color: #fff; }
  #hint { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    text-align: center; color: var(--muted); font-size: 15px; line-height: 1.7;
    z-index: 1; pointer-events: none; }
  #hint b { color: var(--ink); }
  kbd { background: #3c4552; border-radius: 5px; padding: 1px 6px; font-size: 12px;
    border: 1px solid rgba(255,255,255,0.12); }

  /* Layers panel */
  #layers { position: absolute; left: 12px; top: 88px; width: 214px; z-index: 4;
    display: flex; flex-direction: column; max-height: calc(100vh - 170px);
    background: rgba(42,48,58,0.92); backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.35); }
  .lp-head { display: flex; align-items: center; justify-content: space-between;
    padding: 9px 10px 7px; font-size: 11px; font-weight: 700; letter-spacing: .05em;
    text-transform: uppercase; color: var(--muted); }
  .lp-head button { min-height: 28px; padding: 4px 10px; font-size: 15px; line-height: 1; }
  #layerList { overflow-y: auto; padding: 2px 6px; }
  .lrow { display: flex; align-items: center; gap: 5px; padding: 6px 6px;
    border-radius: 8px; cursor: pointer; }
  .lrow:hover { background: rgba(255,255,255,0.05); }
  .lrow.active { background: rgba(99,102,241,0.22); outline: 1px solid rgba(99,102,241,0.5); }
  .lrow.dragging { opacity: .5; background: rgba(99,102,241,0.30); }
  .lgrip { flex: 0 0 auto; width: 14px; text-align: center; cursor: grab;
    color: var(--muted); font-size: 13px; line-height: 1; touch-action: none;
    user-select: none; }
  .lgrip:active { cursor: grabbing; }
  .lrow .eye { background: none; border: none; padding: 0; min-height: 0;
    width: 22px; font-size: 14px; cursor: pointer; filter: grayscale(0); opacity: 1; }
  .lrow .eye.off { opacity: .35; }
  .lswatch { width: 22px; height: 22px; padding: 0; border: none; border-radius: 6px;
    background: none; cursor: pointer; flex: 0 0 auto; }
  .lname { flex: 1 1 auto; font-size: 13px; color: var(--ink); font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lcount { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums;
    min-width: 16px; text-align: right; }
  .ldel { background: none; border: none; padding: 0; min-height: 0; width: 20px;
    color: var(--muted); font-size: 13px; cursor: pointer; }
  .ldel:hover { color: var(--danger); }
  .lp-foot { padding: 8px 10px; border-top: 1px solid rgba(255,255,255,0.08);
    display: flex; align-items: center; gap: 8px; }
  .lp-foot label { font-size: 10px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: .04em; }
  .lp-foot input[type=range] { flex: 1; accent-color: var(--accent); }
  .lp-foot .val { font-size: 11px; }

  /* Save toast */
  #toast { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%);
    z-index: 9; background: rgba(34,197,94,0.95); color: #06210f;
    padding: 9px 16px; border-radius: 10px; font-size: 13px; font-weight: 700;
    box-shadow: 0 6px 24px rgba(0,0,0,0.4); opacity: 0; pointer-events: none;
    transition: opacity .2s; }
  #toast.show { opacity: 1; }
  #toast.err { background: rgba(239,68,68,0.95); color: #fff; }
</style>

<div id="stage">
  <canvas id="board"></canvas>

  <div id="bar">
    <div class="grp">
      <label class="file" title="Load a reference image to trace">
        🖼️ Image<input type="file" id="imgFile" accept="image/*">
      </label>
      <label class="file" title="Open a saved .json trace">
        📂 Open<input type="file" id="jsonFile" accept="application/json,.json">
      </label>
    </div>
    <div class="field" title="Reference image opacity">
      <span>Image</span>
      <div class="row"><input type="range" id="imgOpacity" min="0" max="100" value="45">
        <span class="val" id="imgOpacityV">45%</span></div>
    </div>
    <div class="sep"></div>
    <div class="grp">
      <input type="color" id="penColor" value="#111111" title="Active layer colour">
      <div class="field" title="Base pen width (artboard units)">
        <span>Width</span>
        <div class="row"><input type="range" id="penWidth" min="1" max="18" step="0.5" value="4">
          <span class="val" id="penWidthV">4</span></div>
      </div>
    </div>
    <div class="sep"></div>
    <div class="field" title="Pen stabiliser — smooths hand jitter (EMA over points)">
      <span>Stabilizer</span>
      <div class="row"><input type="range" id="stab" min="0" max="100" value="35">
        <span class="val" id="stabV">35</span></div>
    </div>
    <label class="chk" title="Catmull-Rom smoothing for flowing curves"><input type="checkbox" id="smooth" checked> Smooth</label>
    <label class="chk" title="Render pressure as variable line width"><input type="checkbox" id="varw" checked> Pressure</label>
    <div class="sep"></div>
    <div class="grp">
      <button id="undo" class="ghost" title="Undo (Ctrl/Cmd+Z)">↶</button>
      <button id="redo" class="ghost" title="Redo (Ctrl/Cmd+Shift+Z)">↷</button>
      <button id="fit" class="ghost" title="Fit view to image">⤢ Fit</button>
      <button id="clear" class="ghost danger" title="Clear all strokes">Clear</button>
    </div>
    <div class="sep"></div>
    <div class="grp">
      <label class="chk" title="Store the reference image inside the JSON — makes it a portable, self-contained project file"><input type="checkbox" id="embedImg" checked> Embed</label>
      <button id="connectFolder" class="ghost" title="Connect a folder to save files into directly (Chromium browsers)">📁 Folder</button>
      <button id="saveJson" title="Save lossless .json (re-openable)">💾 JSON</button>
      <button id="saveSvg" class="on" title="Export processed .svg">⬇︎ SVG</button>
    </div>
  </div>

  <div id="hint">
    <b>Load an image</b> and trace over it with your pen.<br>
    Pen draws · one finger pans · two fingers pinch-zoom · wheel zooms.<br>
    Pressure is captured and drawn as variable-width ink.
  </div>

  <div id="layers">
    <div class="lp-head"><span>Layers</span>
      <button id="addLayer" title="Add a new layer on top">＋</button></div>
    <div id="layerList"></div>
    <div class="lp-foot">
      <label>Opacity</label>
      <input type="range" id="layerOpacity" min="0" max="100" value="100" title="Active layer opacity">
      <span class="val" id="layerOpacityV">100%</span>
    </div>
  </div>

  <div id="hud">
    <span>Zoom <b id="zoomV">100%</b></span>
    <span>Strokes <b id="strokeV">0</b></span>
    <span>Points <b id="pointV">0</b></span>
  </div>
  <div id="press">
    <div class="cap"><span>Pen pressure</span><span id="pval">0.00</span></div>
    <div id="pbar"><div id="pfill"></div></div>
  </div>
  <div id="drop">Drop image to trace</div>
  <div id="toast"></div>
</div>

<script>
"use strict";
// ─────────────────────────────────────────────────────────────────────────
//  State
// ─────────────────────────────────────────────────────────────────────────
const board = document.getElementById('board');
const ctx = board.getContext('2d');

let AW = 1000, AH = 1400;          // artboard size (matches image when loaded)
let bgImage = null, bgName = null; // reference image + filename
let dirHandle = null;              // connected folder (File System Access API)
let dragLayerId = null;            // layer being drag-reordered in the panel
let view = { s: 1, ox: 0, oy: 0 }; // artboard→CSS: css = o + s*artboard
let dpr = Math.max(1, window.devicePixelRatio || 1);

// Layers: ordered stroke groups. Later in the array = drawn on top.
//   { id, name, color, visible, opacity, strokes:[{color,width,points:[{x,y,p,t}]}] }
let layers = [];
let activeId = null;               // id of the layer new strokes go into
let undoStack = [];                // [{layerId, stroke}] in draw order
let redoStack = [];
let current = null;                // stroke being drawn
let layerSeq = 0;                  // monotonic counter for default names/colours

const LAYER_PALETTE = ['#111111', '#ef4444', '#2563eb', '#16a34a',
                       '#d97706', '#7c3aed', '#db2777', '#0891b2'];

// Settings (mirrored from the toolbar)
const cfg = { imgOpacity: 0.45, penColor: '#111111', penWidth: 4,
              stab: 0.35, smooth: true, varw: true, embedImage: true };

function newLayer(color) {
  layerSeq++;
  return { id: 'L' + Date.now() + '_' + layerSeq, name: 'Layer ' + layerSeq,
           color: color || LAYER_PALETTE[(layerSeq - 1) % LAYER_PALETTE.length],
           visible: true, opacity: 1, strokes: [] };
}
function activeLayer() { return layers.find(l => l.id === activeId) || layers[0]; }
function allStrokes() { return layers.reduce((a, l) => a.concat(l.strokes), []); }

// Active pointers, split by role (pen/mouse draw; touches drive the view).
const touches = new Map();
let gesture = null;                // pan / pinch state

// ─────────────────────────────────────────────────────────────────────────
//  Canvas sizing (HiDPI)
// ─────────────────────────────────────────────────────────────────────────
function resize() {
  dpr = Math.max(1, window.devicePixelRatio || 1);
  board.width = Math.round(innerWidth * dpr);
  board.height = Math.round(innerHeight * dpr);
  board.style.width = innerWidth + 'px';
  board.style.height = innerHeight + 'px';
  render();
}
window.addEventListener('resize', resize);

// ─────────────────────────────────────────────────────────────────────────
//  Coordinate transforms
// ─────────────────────────────────────────────────────────────────────────
function toArtboard(clientX, clientY) {
  const r = board.getBoundingClientRect();
  return { x: (clientX - r.left - view.ox) / view.s,
           y: (clientY - r.top  - view.oy) / view.s };
}
function fitView() {
  const pad = 60;
  const sw = innerWidth - pad * 2, sh = innerHeight - pad * 2;
  view.s = Math.min(sw / AW, sh / AH);
  view.ox = (innerWidth - AW * view.s) / 2;
  view.oy = (innerHeight - AH * view.s) / 2;
  render();
}
function zoomAbout(cx, cy, factor) {
  const s2 = Math.min(40, Math.max(0.05, view.s * factor));
  // keep the artboard point under (cx,cy) fixed
  const ax = (cx - view.ox) / view.s, ay = (cy - view.oy) / view.s;
  view.s = s2;
  view.ox = cx - ax * s2;
  view.oy = cy - ay * s2;
  render();
}

// ─────────────────────────────────────────────────────────────────────────
//  Stabilisation (ported + extended from the collector)
// ─────────────────────────────────────────────────────────────────────────
// EMA "pull" over point positions — the pen stabiliser. Non-destructive:
// raw points are untouched; this runs at render/export time.
function stabilize(points, strength) {
  if (strength <= 0 || points.length < 2) return points;
  const a = 1 - strength;                 // blend of the new raw point
  const out = [{ ...points[0] }];
  let sx = points[0].x, sy = points[0].y, sp = points[0].p;
  for (let i = 1; i < points.length; i++) {
    sx += (points[i].x - sx) * a;
    sy += (points[i].y - sy) * a;
    sp += (points[i].p - sp) * a;
    out.push({ x: sx, y: sy, p: sp, t: points[i].t });
  }
  return out;
}

// Catmull-Rom interpolation for flowing curves (verbatim mechanic from
// GlyphCollectorUI: raw preserved, this is a resample for display/export).
function catmullRom(stroke) {
  if (stroke.length < 3) return stroke;
  const result = [stroke[0]];
  for (let i = 0; i < stroke.length - 1; i++) {
    const p0 = stroke[Math.max(0, i - 1)];
    const p1 = stroke[i];
    const p2 = stroke[Math.min(stroke.length - 1, i + 1)];
    const p3 = stroke[Math.min(stroke.length - 1, i + 2)];
    const segLen = Math.hypot(p2.x - p1.x, p2.y - p1.y);
    const steps = Math.max(2, Math.min(12, Math.floor(segLen / 4)));
    for (let s = 1; s <= steps; s++) {
      const t = s / steps, t2 = t * t, t3 = t2 * t;
      const x = 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t +
        (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 +
        (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3);
      const y = 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * t +
        (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 +
        (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3);
      const p = p1.p + (p2.p - p1.p) * t;
      result.push({ x, y, p });
    }
  }
  return result;
}

// Full processing pipeline: stabilise, then optional curve smoothing.
function processStroke(stroke) {
  let pts = stabilize(stroke.points, cfg.stab);
  if (cfg.smooth) pts = catmullRom(pts);
  return pts;
}

// Map pen pressure → half-width in artboard units.
function halfWidth(baseW, p) { return baseW * (0.35 + 1.15 * p) / 2; }

// ─────────────────────────────────────────────────────────────────────────
//  Rendering
// ─────────────────────────────────────────────────────────────────────────
// Install the artboard→device matrix on a context (§ coordinate systems).
function worldTransform(c) {
  c.setTransform(dpr * view.s, 0, 0, dpr * view.s, dpr * view.ox, dpr * view.oy);
  c.lineCap = 'round'; c.lineJoin = 'round';
}

// A reusable offscreen buffer for compositing a whole layer at < 100%
// opacity (so overlapping strokes flatten first, instead of double-darkening).
let _off = null, _offctx = null;
function ensureOff() {
  if (!_off) { _off = document.createElement('canvas'); _offctx = _off.getContext('2d'); }
  if (_off.width !== board.width || _off.height !== board.height) {
    _off.width = board.width; _off.height = board.height;
  }
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, board.width, board.height);
  worldTransform(ctx);

  // Artboard sheet
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, AW, AH);
  // Reference image
  if (bgImage) {
    ctx.globalAlpha = cfg.imgOpacity;
    ctx.drawImage(bgImage, 0, 0, AW, AH);
    ctx.globalAlpha = 1;
  }
  // Layers, bottom to top
  for (const layer of layers) {
    if (!layer.visible || layer.strokes.length === 0) continue;
    if (layer.opacity >= 0.999) {
      for (const st of layer.strokes) drawStroke(ctx, st);
    } else {
      // Flatten the layer offscreen, then composite once at its opacity.
      ensureOff();
      _offctx.setTransform(1, 0, 0, 1, 0, 0);
      _offctx.clearRect(0, 0, _off.width, _off.height);
      worldTransform(_offctx);
      for (const st of layer.strokes) drawStroke(_offctx, st);
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = layer.opacity;
      ctx.drawImage(_off, 0, 0);
      ctx.restore();
      worldTransform(ctx);
    }
  }
}

function drawStroke(c, st) {
  const pts = processStroke(st);
  if (pts.length === 0) return;
  if (pts.length === 1) {                       // a tap → a dot
    c.beginPath();
    c.arc(pts[0].x, pts[0].y, halfWidth(st.width, pts[0].p), 0, Math.PI * 2);
    c.fillStyle = st.color; c.fill();
    return;
  }
  if (cfg.varw) {
    // Pressure as variable width — filled outline around the centerline.
    c.beginPath();
    outlinePath(c, pts, st.width);
    c.fillStyle = st.color; c.fill();
  } else {
    c.beginPath();
    c.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) c.lineTo(pts[i].x, pts[i].y);
    c.strokeStyle = st.color; c.lineWidth = st.width; c.stroke();
  }
}

// Build a closed outline polygon: offset each point ±halfWidth along the
// local normal, forward down one side and back up the other.
function outlinePoints(pts, baseW) {
  const left = [], right = [];
  for (let i = 0; i < pts.length; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
    let tx = b.x - a.x, ty = b.y - a.y;
    const len = Math.hypot(tx, ty) || 1; tx /= len; ty /= len;
    const nx = -ty, ny = tx;                    // left normal
    const w = halfWidth(baseW, pts[i].p);
    left.push({ x: pts[i].x + nx * w, y: pts[i].y + ny * w });
    right.push({ x: pts[i].x - nx * w, y: pts[i].y - ny * w });
  }
  return left.concat(right.reverse());
}
function outlinePath(c, pts, baseW) {
  const poly = outlinePoints(pts, baseW);
  c.moveTo(poly[0].x, poly[0].y);
  for (let i = 1; i < poly.length; i++) c.lineTo(poly[i].x, poly[i].y);
  c.closePath();
}

// ─────────────────────────────────────────────────────────────────────────
//  Pointer input
// ─────────────────────────────────────────────────────────────────────────
function isDrawPointer(e) { return e.pointerType === 'pen' || e.pointerType === 'mouse'; }

board.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'touch') { touches.set(e.pointerId, ptOf(e)); startGesture(); return; }
  // pen / mouse → draw into the active layer
  board.setPointerCapture(e.pointerId);
  document.getElementById('hint').style.display = 'none';
  const layer = activeLayer();
  current = { color: layer.color, width: cfg.penWidth, points: [] };
  layer.strokes.push(current);
  undoStack.push({ layerId: layer.id, stroke: current });
  redoStack = [];
  addPoint(e);
  render(); updateHud(); renderLayerPanel();
});

board.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'touch') {
    if (!touches.has(e.pointerId)) return;
    touches.set(e.pointerId, ptOf(e)); updateGesture(); return;
  }
  if (!current) return;
  if (e.getCoalescedEvents) e.getCoalescedEvents().forEach(addPoint);
  else addPoint(e);
  render(); updateHud();
});

function endPointer(e) {
  if (e.pointerType === 'touch') { touches.delete(e.pointerId); startGesture(); return; }
  if (current) { current = null; updateHud(); }
}
board.addEventListener('pointerup', endPointer);
board.addEventListener('pointercancel', endPointer);
board.addEventListener('contextmenu', (e) => e.preventDefault());

function ptOf(e) { return { x: e.clientX, y: e.clientY }; }

function addPoint(e) {
  const a = toArtboard(e.clientX, e.clientY);
  const p = (e.pressure > 0 && e.pressure !== 0.5) ? e.pressure
            : (e.pointerType === 'pen' ? e.pressure : 0.5); // mouse has no pressure
  const pv = (typeof p === 'number' && p > 0) ? p : 0.5;
  current.points.push({ x: a.x, y: a.y, p: pv, t: Date.now() });
  showPressure(pv);
}

// ── Touch gestures: 1 finger pan, 2 finger pinch-zoom ──
function startGesture() {
  const list = [...touches.values()];
  if (list.length === 1) {
    gesture = { mode: 'pan', start: list[0], ox: view.ox, oy: view.oy };
  } else if (list.length >= 2) {
    const [a, b] = list;
    gesture = { mode: 'pinch',
      dist: Math.hypot(a.x - b.x, a.y - b.y),
      mid: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 },
      s: view.s, ox: view.ox, oy: view.oy };
  } else gesture = null;
}
function updateGesture() {
  const list = [...touches.values()];
  if (!gesture) return;
  if (gesture.mode === 'pan' && list.length === 1) {
    view.ox = gesture.ox + (list[0].x - gesture.start.x);
    view.oy = gesture.oy + (list[0].y - gesture.start.y);
    render();
  } else if (gesture.mode === 'pinch' && list.length >= 2) {
    const [a, b] = list;
    const dist = Math.hypot(a.x - b.x, a.y - b.y);
    const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    const s2 = Math.min(40, Math.max(0.05, gesture.s * (dist / gesture.dist)));
    // artboard point under the gesture's start midpoint, using start transform
    const ax = (gesture.mid.x - gesture.ox) / gesture.s;
    const ay = (gesture.mid.y - gesture.oy) / gesture.s;
    view.s = s2;
    view.ox = mid.x - ax * s2;   // follow the current midpoint (pan+zoom)
    view.oy = mid.y - ay * s2;
    render();
  } else startGesture();
  updateHud();
}

// Wheel zoom (desktop), centred on the cursor.
board.addEventListener('wheel', (e) => {
  e.preventDefault();
  const r = board.getBoundingClientRect();
  zoomAbout(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.1 : 1 / 1.1);
  updateHud();
}, { passive: false });

// ─────────────────────────────────────────────────────────────────────────
//  HUD
// ─────────────────────────────────────────────────────────────────────────
function updateHud() {
  document.getElementById('zoomV').textContent = Math.round(view.s * 100) + '%';
  const all = allStrokes();
  document.getElementById('strokeV').textContent = all.length;
  document.getElementById('pointV').textContent =
    all.reduce((n, s) => n + s.points.length, 0);
}
function showPressure(p) {
  document.getElementById('pval').textContent = p.toFixed(2);
  document.getElementById('pfill').style.width = Math.round(p * 100) + '%';
}

// ─────────────────────────────────────────────────────────────────────────
//  Image loading
// ─────────────────────────────────────────────────────────────────────────
function loadImageFromSrc(src, name) {
  const img = new Image();
  img.onload = () => {
    bgImage = img; bgName = name || null;
    AW = img.naturalWidth || 1000; AH = img.naturalHeight || 1400;
    document.getElementById('hint').style.display = 'none';
    fitView(); updateHud();
  };
  img.src = src;
}
function readImageFile(file) {
  if (!file) return;
  const fr = new FileReader();
  fr.onload = () => loadImageFromSrc(fr.result, file.name);
  fr.readAsDataURL(file);
}
document.getElementById('imgFile').addEventListener('change', (e) => readImageFile(e.target.files[0]));

// Drag & drop an image
const drop = document.getElementById('drop');
['dragenter', 'dragover'].forEach(ev => window.addEventListener(ev, (e) => {
  e.preventDefault(); drop.style.display = 'flex';
}));
['dragleave', 'drop'].forEach(ev => window.addEventListener(ev, (e) => {
  e.preventDefault(); if (ev === 'dragleave' && e.relatedTarget) return;
  drop.style.display = 'none';
}));
window.addEventListener('drop', (e) => {
  const f = e.dataTransfer && e.dataTransfer.files[0];
  if (f && f.type.startsWith('image/')) readImageFile(f);
});

// ─────────────────────────────────────────────────────────────────────────
//  Save / load
// ─────────────────────────────────────────────────────────────────────────
function download(name, mime, data) {
  const blob = new Blob([data], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

let _toastTimer = null;
function showToast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { t.className = ''; }, 2600);
}

// Save a file to the connected folder if one is attached; otherwise download.
async function saveFile(name, mime, data) {
  if (dirHandle) {
    try {
      const fh = await dirHandle.getFileHandle(name, { create: true });
      const w = await fh.createWritable();
      await w.write(data);
      await w.close();
      showToast(`Saved ${name} → ${dirHandle.name}/`);
      return;
    } catch (e) {
      showToast('Folder save failed — downloaded instead', true);
    }
  }
  download(name, mime, data);
}

function buildImageMeta() {
  if (!bgName && !bgImage) return null;
  const meta = { name: bgName };
  // Embed the reference as a data-URL so the JSON is a portable, self-
  // contained project (reopens with its image). bgImage.src already holds
  // the data-URL (images are always loaded via FileReader.readAsDataURL).
  if (cfg.embedImage && bgImage && /^data:/.test(bgImage.src)) {
    meta.data = bgImage.src;
  }
  return meta;
}
function buildJSON() {
  return JSON.stringify({
    type: 'vhs-trace', version: 2,
    artboard: { width: AW, height: AH },
    image: buildImageMeta(),
    settings: { stabilizer: cfg.stab, smooth: cfg.smooth,
                variable_width: cfg.varw },
    layers: layers.map(l => ({
      name: l.name, color: l.color, visible: l.visible, opacity: l.opacity,
      strokes: l.strokes.map(s => ({
        color: s.color, width: s.width,
        points: s.points.map(p => ({ x: round(p.x), y: round(p.y),
                                     p: round(p.p, 3), t: p.t }))
      }))
    }))
  }, null, 1);
}
function round(v, d = 2) { const m = 10 ** d; return Math.round(v * m) / m; }
function escapeAttr(s) {
  return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

// One stroke → one SVG element string (pressure baked in when varw is on).
function svgStroke(st) {
  const pts = processStroke(st);
  if (pts.length === 0) return '';
  if (pts.length === 1)
    return `<circle cx="${round(pts[0].x)}" cy="${round(pts[0].y)}" ` +
           `r="${round(halfWidth(st.width, pts[0].p))}" fill="${st.color}"/>`;
  if (cfg.varw) {
    const poly = outlinePoints(pts, st.width);
    const d = 'M ' + poly.map(q => `${round(q.x)} ${round(q.y)}`).join(' L ') + ' Z';
    return `<path d="${d}" fill="${st.color}"/>`;
  }
  const d = 'M ' + pts.map(q => `${round(q.x)} ${round(q.y)}`).join(' L ');
  return `<path d="${d}" fill="none" stroke="${st.color}" ` +
    `stroke-width="${st.width}" stroke-linecap="round" stroke-linejoin="round"/>`;
}

function buildSVG() {
  const parts = [];
  parts.push(`<?xml version="1.0" encoding="utf-8"?>`);
  parts.push(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${AW} ${AH}" ` +
             `width="${AW}" height="${AH}">`);
  // Each visible layer → a <g>, so the layer structure survives into SVG.
  for (const layer of layers) {
    if (!layer.visible || layer.strokes.length === 0) continue;
    const op = layer.opacity < 0.999 ? ` opacity="${round(layer.opacity, 3)}"` : '';
    parts.push(`  <g${op} data-layer="${escapeAttr(layer.name)}">`);
    for (const st of layer.strokes) {
      const seg = svgStroke(st);
      if (seg) parts.push('    ' + seg);
    }
    parts.push('  </g>');
  }
  parts.push('</svg>');
  return parts.join('\n');
}

function loadTraceJSON(obj) {
  if (!obj || obj.type !== 'vhs-trace') { alert('Not a VHS trace file.'); return; }
  if (obj.artboard) { AW = obj.artboard.width; AH = obj.artboard.height; }
  // Restore an embedded reference image, if the project carried one.
  if (obj.image && obj.image.data) {
    loadImageFromSrc(obj.image.data, obj.image.name || null);
  } else {
    bgImage = null; bgName = (obj.image && obj.image.name) || null;
  }
  const mkStroke = s => ({
    color: s.color || '#111111', width: s.width || 4,
    points: (s.points || []).map(p => ({ x: p.x, y: p.y,
                                         p: p.p != null ? p.p : 0.5, t: p.t || 0 }))
  });
  layerSeq = 0; layers = [];
  if (Array.isArray(obj.layers)) {                 // v2
    obj.layers.forEach(l => {
      const lay = newLayer(l.color || '#111111');
      lay.name = l.name || lay.name;
      lay.visible = l.visible !== false;
      lay.opacity = (l.opacity != null) ? l.opacity : 1;
      lay.strokes = (l.strokes || []).map(mkStroke);
      layers.push(lay);
    });
  } else if (Array.isArray(obj.strokes)) {         // v1 back-compat → single layer
    const lay = newLayer('#111111'); lay.name = 'Layer 1';
    lay.strokes = obj.strokes.map(mkStroke);
    layers.push(lay);
  }
  if (!layers.length) layers.push(newLayer('#111111'));
  activeId = layers[layers.length - 1].id;
  undoStack = []; redoStack = [];
  if (obj.settings) {
    if (obj.settings.stabilizer != null) setStab(obj.settings.stabilizer);
    if (obj.settings.smooth != null) { cfg.smooth = obj.settings.smooth; document.getElementById('smooth').checked = cfg.smooth; }
    if (obj.settings.variable_width != null) { cfg.varw = obj.settings.variable_width; document.getElementById('varw').checked = cfg.varw; }
  }
  syncPenColor(); renderLayerPanel();
  document.getElementById('hint').style.display = 'none';
  fitView(); updateHud();
}
document.getElementById('jsonFile').addEventListener('change', (e) => {
  const f = e.target.files[0]; if (!f) return;
  const fr = new FileReader();
  fr.onload = () => { try { loadTraceJSON(JSON.parse(fr.result)); } catch (err) { alert('Bad JSON: ' + err); } };
  fr.readAsText(f);
});

// ─────────────────────────────────────────────────────────────────────────
//  Toolbar wiring
// ─────────────────────────────────────────────────────────────────────────
function bindRange(id, apply, fmt) {
  const el = document.getElementById(id), out = document.getElementById(id + 'V');
  el.addEventListener('input', () => { apply(parseFloat(el.value)); if (out) out.textContent = fmt(parseFloat(el.value)); });
}
bindRange('imgOpacity', v => { cfg.imgOpacity = v / 100; render(); }, v => v + '%');
bindRange('penWidth', v => { cfg.penWidth = v; }, v => v);
function setStab(v) {
  const el = document.getElementById('stab');
  el.value = Math.round(v * 100);
  cfg.stab = v * 0.85;               // slider 0..100 → strength 0..0.85
  document.getElementById('stabV').textContent = Math.round(v * 100);
  render();
}
document.getElementById('stab').addEventListener('input', (e) => {
  const raw = parseFloat(e.target.value) / 100;
  cfg.stab = raw * 0.85;
  document.getElementById('stabV').textContent = Math.round(raw * 100);
  render();
});
// The toolbar colour picker edits the ACTIVE layer's colour (a layer is one
// colour): it updates the swatch and recolours that layer's existing strokes.
document.getElementById('penColor').addEventListener('input', (e) => {
  const l = activeLayer();
  if (l) setLayerColor(l, e.target.value); else cfg.penColor = e.target.value;
});
document.getElementById('smooth').addEventListener('change', (e) => { cfg.smooth = e.target.checked; render(); });
document.getElementById('varw').addEventListener('change', (e) => { cfg.varw = e.target.checked; render(); });
document.getElementById('embedImg').addEventListener('change', (e) => { cfg.embedImage = e.target.checked; });

document.getElementById('fit').addEventListener('click', fitView);
document.getElementById('clear').addEventListener('click', () => {
  const l = activeLayer(); if (!l) return;
  if (l.strokes.length && !confirm(`Clear all strokes on "${l.name}"?`)) return;
  l.strokes = [];
  undoStack = undoStack.filter(u => u.layerId !== l.id);
  redoStack = redoStack.filter(u => u.layerId !== l.id);
  render(); updateHud(); renderLayerPanel();
});
document.getElementById('undo').addEventListener('click', undo);
document.getElementById('redo').addEventListener('click', redo);
function baseName() { return bgName ? bgName.replace(/\.[^.]+$/, '') : 'trace'; }
document.getElementById('saveJson').addEventListener('click', () =>
  saveFile(baseName() + '.json', 'application/json', buildJSON()));
document.getElementById('saveSvg').addEventListener('click', () =>
  saveFile(baseName() + '.svg', 'image/svg+xml', buildSVG()));

// ── Direct-save to a folder (File System Access API) ──
const folderBtn = document.getElementById('connectFolder');
if (!window.showDirectoryPicker) {
  folderBtn.style.display = 'none';   // unsupported (Safari/Firefox) → downloads only
} else {
  folderBtn.addEventListener('click', async () => {
    try {
      dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
      folderBtn.textContent = '📁 ' + dirHandle.name;
      folderBtn.classList.remove('ghost');
      folderBtn.classList.add('on');
      folderBtn.title = `Saving into ${dirHandle.name}/ — click to change folder`;
      showToast(`Connected: ${dirHandle.name}/ — saves go here`);
    } catch (e) {
      if (e && e.name !== 'AbortError') showToast('Could not open folder', true);
    }
  });
}

// ── Layers ──
function syncPenColor() {
  const l = activeLayer(); if (!l) return;
  cfg.penColor = l.color;
  document.getElementById('penColor').value = l.color;
}
function syncLayerOpacity() {
  const l = activeLayer(); if (!l) return;
  document.getElementById('layerOpacity').value = Math.round(l.opacity * 100);
  document.getElementById('layerOpacityV').textContent = Math.round(l.opacity * 100) + '%';
}
function setLayerColor(layer, color) {
  layer.color = color;
  layer.strokes.forEach(s => s.color = color);
  if (layer.id === activeId) {
    cfg.penColor = color;
    document.getElementById('penColor').value = color;
  }
  renderLayerPanel(); render();
}
function addLayer() {
  const l = newLayer(); layers.push(l); activeId = l.id;
  syncPenColor(); syncLayerOpacity(); renderLayerPanel(); render(); updateHud();
}
function deleteLayer(l) {
  if (layers.length === 1) {                       // keep at least one — just empty it
    l.strokes = [];
  } else {
    if (l.strokes.length && !confirm(`Delete "${l.name}" and its ${l.strokes.length} stroke(s)?`)) return;
    layers = layers.filter(x => x !== l);
    if (activeId === l.id) activeId = layers[layers.length - 1].id;
  }
  undoStack = undoStack.filter(u => u.layerId !== l.id);
  redoStack = redoStack.filter(u => u.layerId !== l.id);
  syncPenColor(); syncLayerOpacity(); renderLayerPanel(); render(); updateHud();
}
function renderLayerPanel() {
  const list = document.getElementById('layerList');
  list.innerHTML = '';
  for (let i = layers.length - 1; i >= 0; i--) {   // topmost layer at the top
    const l = layers[i];
    const row = document.createElement('div');
    row.className = 'lrow' + (l.id === activeId ? ' active' : '')
                          + (l.id === dragLayerId ? ' dragging' : '');
    row.onclick = () => { activeId = l.id; syncPenColor(); syncLayerOpacity(); renderLayerPanel(); };

    const grip = document.createElement('div');
    grip.className = 'lgrip'; grip.textContent = '⠿';
    grip.title = 'Drag to reorder';
    grip.addEventListener('pointerdown', (e) => { e.stopPropagation(); startLayerDrag(l.id, e); });

    const eye = document.createElement('button');
    eye.className = 'eye' + (l.visible ? '' : ' off');
    eye.textContent = l.visible ? '👁' : '🙈';
    eye.title = 'Toggle visibility';
    eye.onclick = (e) => { e.stopPropagation(); l.visible = !l.visible; renderLayerPanel(); render(); };

    const col = document.createElement('input');
    col.type = 'color'; col.value = l.color; col.className = 'lswatch';
    col.title = 'Layer colour';
    col.oninput = (e) => setLayerColor(l, e.target.value);
    col.onclick = (e) => e.stopPropagation();

    const name = document.createElement('div');
    name.className = 'lname'; name.textContent = l.name;
    name.title = 'Click to select · double-click to rename';
    name.ondblclick = (e) => {
      e.stopPropagation();
      const n = prompt('Layer name', l.name);
      if (n) { l.name = n.trim() || l.name; renderLayerPanel(); }
    };

    const cnt = document.createElement('span');
    cnt.className = 'lcount'; cnt.textContent = l.strokes.length;

    const del = document.createElement('button');
    del.className = 'ldel'; del.textContent = '✕'; del.title = 'Delete layer';
    del.onclick = (e) => { e.stopPropagation(); deleteLayer(l); };

    row.append(grip, eye, col, name, cnt, del);
    list.appendChild(row);
  }
}

// ── Drag-to-reorder layers ──
// Rows show topmost layer first (array reversed), so we reorder a top-first
// "visual" copy and map it back. Panel rows are rebuilt on every move, so the
// drag listens on `document` (a stable target) rather than on a row element.
function reorderTo(dragId, insertVisual) {
  let visual = layers.slice().reverse();
  const from = visual.findIndex(l => l.id === dragId);
  if (from < 0) return false;
  let t = insertVisual;
  if (t > from) t--;                             // account for the removal below
  const [d] = visual.splice(from, 1);
  t = Math.max(0, Math.min(visual.length, t));
  visual.splice(t, 0, d);
  const next = visual.reverse();
  if (next.some((l, i) => l !== layers[i])) { layers = next; return true; }
  return false;
}
function onLayerDragMove(e) {
  if (!dragLayerId) return;
  e.preventDefault();
  const rows = [...document.getElementById('layerList').children];
  let insertVisual = rows.length;
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i].getBoundingClientRect();
    if (e.clientY < r.top + r.height / 2) { insertVisual = i; break; }
  }
  if (reorderTo(dragLayerId, insertVisual)) { renderLayerPanel(); render(); }
}
function endLayerDrag() {
  dragLayerId = null;
  document.removeEventListener('pointermove', onLayerDragMove);
  renderLayerPanel(); render();
}
function startLayerDrag(id, e) {
  dragLayerId = id;
  e.preventDefault();
  document.addEventListener('pointermove', onLayerDragMove);
  document.addEventListener('pointerup', endLayerDrag, { once: true });
  document.addEventListener('pointercancel', endLayerDrag, { once: true });
  renderLayerPanel();
}

document.getElementById('addLayer').addEventListener('click', addLayer);
document.getElementById('layerOpacity').addEventListener('input', (e) => {
  const l = activeLayer(); if (!l) return;
  l.opacity = parseFloat(e.target.value) / 100;
  document.getElementById('layerOpacityV').textContent = Math.round(l.opacity * 100) + '%';
  render();
});

// Undo/redo operate across layers in true draw order.
function undo() {
  if (!undoStack.length) return;
  const rec = undoStack.pop();
  const l = layers.find(x => x.id === rec.layerId);
  if (l) { const i = l.strokes.indexOf(rec.stroke); if (i >= 0) l.strokes.splice(i, 1); }
  redoStack.push(rec); render(); updateHud(); renderLayerPanel();
}
function redo() {
  if (!redoStack.length) return;
  const rec = redoStack.pop();
  const l = layers.find(x => x.id === rec.layerId);
  if (l) l.strokes.push(rec.stroke);
  undoStack.push(rec); render(); updateHud(); renderLayerPanel();
}
window.addEventListener('keydown', (e) => {
  const z = e.key === 'z' || e.key === 'Z';
  if ((e.metaKey || e.ctrlKey) && z && !e.shiftKey) { e.preventDefault(); undo(); }
  else if ((e.metaKey || e.ctrlKey) && z && e.shiftKey) { e.preventDefault(); redo(); }
});

// ─────────────────────────────────────────────────────────────────────────
//  Boot
// ─────────────────────────────────────────────────────────────────────────
layers = [newLayer('#111111')];        // start with one layer
activeId = layers[0].id;
syncPenColor(); syncLayerOpacity(); renderLayerPanel();
resize();
fitView();
updateHud();
// Expose a few internals for headless testing.
window.__tracer = {
  get layers() { return layers; },
  get strokes() { return allStrokes(); },
  get activeId() { return activeId; },
  get view() { return view; },
  buildJSON, buildSVG, loadTraceJSON, processStroke,
  addLayer, renderLayerPanel, render, updateHud,
  loadImageFromSrc, cfg, reorderTo, saveFile,
  setDirHandle(h) { dirHandle = h; },
  get imageSrc() { return bgImage ? bgImage.src : null; },
  get imageName() { return bgName; },
  addStroke(s) { activeLayer().strokes.push(s); }
};
</script>
